<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Product preview card component | Frontend Mentor</title>

  <!-- Styles -->
  <link rel="stylesheet" href="./assets/styles/styles.css">
</head>

<body>
  <main>
    <article class="product-card">
      <picture>
        <source media="(min-width: 1440px)" srcset="./assets/images/image-product-desktop.jpg">
        <img class="product-card__img" width="343" height="240" src="./assets/images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum bottle">
      </picture>
      <div class="product-card__body">
        <div class="product-card__details">
          <p class="product-card__category">Perfume</p>
          <h1 class="product-card__title">Gabrielle Essence Eau De Parfum</h1>
          <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.</p>
        </div>
        <div class="product-card__footer">
          <div class="product-card__price">
            <strong class="product-card__price--new">$149.99</strong>
            <del class="product-card__price--old">$169.99</del>
          </div>
          <button class="product-card__add-btn" type="button">
            <img class="product-card__icon" src="./assets/images/icon-cart.svg" alt="" aria-hidden="true"> Add to Cart
          </button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
