<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Product preview card component | Frontend Mentor</title>

  <!-- Styles -->
  <link rel="stylesheet" href="./assets/styles/styles.css">
</head>

<body>
  <main>
    <div class="product-card">
      <picture>
        <source media="(min-width: 1440px)" width="300" height="450" srcset="./assets/images/image-product-desktop.jpg">
        <img class="product-card__product-img" width="343" height="240" src="./assets/images/image-product-mobile.jpg" alt="product">
      </picture>
      <div class="product-card__body">
        <div class="product-card__text-content">
          <p class="product-card__category">Perfume</p>
          <p class="product-card__title">Gabrielle Essence Eau De Parfum</p>
          <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.</p>
        </div>
        <div class="product-card__price-and-add">
          <div class="product-card__price-container">
            <p class="product-card__new-price">$149.99</p>
            <p class="product-card__old-price">$169.99</p>
          </div>
          <button class="product-card__btn">
            <img class="product-card__icon" src="./assets/images/icon-cart.svg" alt="cart icon"> Add to Cart
          </button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
